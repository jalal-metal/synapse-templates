<table class="room">
    <tr class="room_header">
        <td class="room_name">{{ room.title }}</td>
    </tr>
    {%- if room.invite %}
    <tr>
        <td class="notif_link">
            <a class="button" href="{{ room.link }}">Join the conversation</a>
        </td>
    </tr>
    {%- else %}
    {%- for notif in room.notifs %}
    {%- include 'notif.html' with context %}
    {%- endfor %}
    {%- endif %}
</table>
